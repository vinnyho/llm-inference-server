syntax = "proto3";

package llmserver;

service Inference {
  // Streams generated tokens as they are produced. The last message has
  // done = true and carries the finish reason. Returns RESOURCE_EXHAUSTED
  // immediately if the request queue is full.
  rpc Generate(GenerateRequest) returns (stream GenerateReply);
}

message GenerateRequest {
  string prompt = 1;
  int32 n_predict = 2;   // defaults to 32 when unset
}

message GenerateReply {
  string token = 1;
  bool done = 2;
  string finish_reason = 3;   // set on the final message: stop | length | timeout | cancelled | error
  int32 n_generated = 4;      // set on the final message
}
